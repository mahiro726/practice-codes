<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 拾光笔记</title>
    <style>
        /* 全局重置与基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf9f7;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #2d3e50;
            padding: 2rem 1.5rem;
        }

        /* 注册卡片 */
        .register-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 2rem;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #f0ebe4;
        }

        /* 头部 */
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-header .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #d9e2ec, #cbd5e1);
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #4a6a8a;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 16px -6px rgba(0, 0, 0, 0.1);
        }

        .register-header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1e2a3a;
            margin-bottom: 0.4rem;
        }

        .register-header p {
            font-size: 0.95rem;
            color: #8b9aab;
        }

        /* 表单 */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #4a5a6a;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1.1rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: #1e2a3a;
            background: #faf9f7;
            border: 1.5px solid #e8e2d9;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input::placeholder {
            color: #b0bcc8;
        }

        .form-group input:hover {
            border-color: #d5cdc2;
        }

        .form-group input:focus {
            border-color: #4a6a8a;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(74, 106, 138, 0.1);
        }

        /* 密码强度提示 */
        .password-hint {
            font-size: 0.8rem;
            color: #a0b2c2;
            margin-top: 0.1rem;
        }

        /* 用户协议 */
        .form-agreement {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.88rem;
            color: #556b7c;
            line-height: 1.5;
            margin-top: 0.2rem;
            cursor: pointer;
        }

        .form-agreement input {
            width: 16px;
            height: 16px;
            margin-top: 0.2rem;
            flex-shrink: 0;
            accent-color: #1e2a3a;
            cursor: pointer;
        }

        .form-agreement a {
            color: #3e6b9c;
            text-decoration: none;
            transition: color 0.2s;
        }

        .form-agreement a:hover {
            color: #1e2a3a;
            text-decoration: underline;
        }

        /* 注册按钮 */
        .btn-submit {
            width: 100%;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            font-family: inherit;
            color: #ffffff;
            background: #1e2a3a;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 18px -6px rgba(30, 42, 58, 0.35);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: #2d3e50;
            transform: translateY(-1px);
            box-shadow: 0 12px 22px -8px rgba(30, 42, 58, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 6px 12px -4px rgba(30, 42, 58, 0.3);
        }

        .btn-submit:focus-visible {
            outline: 3px solid #4a6a8a;
            outline-offset: 2px;
        }

        /* 底部登录提示 */
        .register-footer {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.92rem;
            color: #8b9aab;
        }

        .register-footer a {
            color: #3e6b9c;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .register-footer a:hover {
            color: #1e2a3a;
            text-decoration: underline;
        }

        /* 返回首页链接 */
        .back-home {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.88rem;
            color: #a0b2c2;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-home:hover {
            color: #4a6a8a;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .register-card {
                padding: 2rem 1.5rem;
                border-radius: 1.5rem;
            }

            .register-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-card">
        <!-- 头部 -->
        <div class="register-header">
            <div class="logo">✨</div>
            <h1>创建账号</h1>
            <p>加入拾光笔记，开始记录你的故事</p>
        </div>

        <!-- 注册表单 -->
        <form class="register-form" action="/Register" method="POST">
            <div class="form-group">
                <label for="username">用户名</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="你的昵称" 
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">邮箱</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your@email.com" 
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="至少 8 位字符" 
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
                <span class="password-hint">建议包含字母、数字和符号</span>
            </div>

            <div class="form-group">
                <label for="confirm-password">确认密码</label>
                <input 
                    type="password" 
                    id="confirm-password" 
                    name="confirm-password" 
                    placeholder="再次输入密码" 
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <label class="form-agreement">
                <input type="checkbox" name="agreement" required>
                <span>我已阅读并同意 <a href="#">用户协议</a> 和 <a href="#">隐私政策</a></span>
            </label>

            <button type="submit" class="btn-submit">注 册</button>
        </form>

        <!-- 底部登录提示 -->
        <div class="register-footer">
            已有账号？<a href="login.html">立即登录</a>
        </div>

        <!-- 返回首页 -->
        <a href="index.html" class="back-home">← 返回首页</a>
    </div>
</body>
</html>
